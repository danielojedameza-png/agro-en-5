name: Agro en 5

on:
  schedule:
    - cron: "7 * * * *"     # cada hora, minuto 7 (UTC)
    - cron: "20 10 * * *"   # 10:20 UTC = 5:20 a.m. Colombia: actualiza y envía boletín
  workflow_dispatch:
    inputs:
      enviar:
        description: "¿Enviar boletín ahora? (si/no)"
        default: "no"

permissions:
  contents: write

concurrency:
  group: agro-en-5
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install feedparser==6.0.11 requests==2.32.3

      - name: Seleccionar las 5 noticias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TERRITORIO_TOKEN: ${{ secrets.TERRITORIO_TOKEN }}
        run: python scripts/actualizar_noticias.py

      - name: Guardar cambios
        run: |
          git config user.name "agro-en-5-bot"
          git config user.email "bot@agrodasin.org.co"
          git add datos/
          git diff --cached --quiet || git commit -m "Noticias $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Enviar boletín diario
        if: github.event.schedule == '20 10 * * *' || github.event.inputs.enviar == 'si'
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LISTA_ID: ${{ secrets.BREVO_LISTA_ID }}
          BREVO_REMITENTE: ${{ secrets.BREVO_REMITENTE }}
          URL_WEB: ${{ vars.URL_WEB }}
        run: python scripts/enviar_boletin.py
